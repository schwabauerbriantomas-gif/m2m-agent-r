[package]
name = "m2m-vector-search"
version = "2.1.0"
edition = "2021"
description = "M2M Vector Search - Native Rust implementation"
license = "AGPL-3.0"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
ndarray-stats = "0.6"
ndarray-rand = "0.15"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
rayon = "1"
clap = { version = "4", features = ["derive"] }
turbo-quant = { path = "C:/Users/user/projects/turbo-quant" }
regex = "1"
chrono = "0.4"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "m2m_bench"
harness = false


