[package]
name = "m2m-vector-search"
version = "2.1.0"
edition = "2021"
description = "M2M Vector Search - Native Rust implementation"
license = "AGPL-3.0"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
approx = "0.5"
