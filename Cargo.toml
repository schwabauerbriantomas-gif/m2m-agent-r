[package]
name = "agent-r"
version = "2.1.0"
edition = "2021"
description = "Agent-R — error memory & self-tuning server for LLM agents (Rust)"
license = "AGPL-3.0"

[features]
critic = ["dep:ureq"]
default = []

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crítico LLM (agent_r::meta, feature "critic"): HTTP blocking mínimo.
ureq = { version = "2", optional = true }

tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
approx = "0.5"
