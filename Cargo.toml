[package]
name = "m2m-vector-search"
version = "2.1.0"
edition = "2021"
description = "M2M Vector Search - Native Rust implementation"
license = "AGPL-3.0"

[features]
critic = ["dep:ureq"]
default = []
cuda = ["cudarc"]

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19", features = ["cuda-12040"], optional = true }
# Crítico LLM (agent_r::meta, feature "critic"): HTTP blocking mínimo.
ureq = { version = "2", optional = true }

tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
approx = "0.5"
